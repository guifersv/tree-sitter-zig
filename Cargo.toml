[package]
name = "tree-sitter-zig"
description = "Zig grammar for tree-sitter"
version = "0.1.1"
authors = ["Guilherme Fernandes <gui.fer.sv@gmail.com>"]
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "zig"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/guifersv/tree-sitter-zig"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.8"
